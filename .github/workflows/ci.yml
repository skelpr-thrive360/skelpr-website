name: CI

# Deliberately one job. This is a prerendered static site: what can break is the
# build, the rendered copy, and the surfaces the crawler reads — so those are what
# run. Everything the previous file carried has been weighed and cut:
#
#   CodeQL          2-4 minutes per run, on every push to main, every pull request
#                   and a weekly cron. It looks for taint reaching the waitlist
#                   fetch from `src/data/benchmarkAnswers.ts`, but that file is
#                   string data rendered by React and there is no server, no
#                   session and no secret in this repository to reach. Dependabot
#                   alerts (free, always on) cover the dependency half.
#   dependency-review  a second job per pull request for a moderate-severity
#                   advisory, which Dependabot opens an alert for anyway.
#   schedule        existed solely to carry the weekly CodeQL sweep.
#   notify-engine   not a gate: it pings the engine repo so its claims job can
#                   re-verify a number, and that job sweeps twice a week whether
#                   or not the ping ever fires.
#
# Concurrency below is the other half of the saving: a second push to a branch
# still re-cancels its own first run, so a rushed stack of commits costs one run
# rather than one each.

on:
  push:
    # main only. A merge into dev was already validated by the pull request that
    # produced it. The trade: a commit pushed straight to dev, bypassing review,
    # goes unvalidated — PR it instead.
    branches: [main]
  # The merge gate. `branches` is the base branch, so a pull request stacked on
  # some other branch (or internal, never to land) spends no run at all.
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Palette matches palette.config.mjs
        run: npm run check:palette

      - name: No machine paths in published copy
        # The verbatim benchmark answers are generated from the engine's docs; this
        # fails if an absolute file link or a maintainer home path reaches the site.
        run: npm run check:hygiene

      # tsc -b, then vite build, then the SSR build, then the prerender pass — so a
      # type error, a broken import and an empty document all fail here.
      - name: Typecheck & build
        run: npm run build

      # Reads dist/, so it must follow the build: text present, one host across
      # canonical/sitemap/robots, length bands, FAQ schema matches the page.
      - name: Built pages are indexable and SEO surfaces agree
        run: npm run check:seo

      - name: In-page hash links resolve
        run: npm run check:links

      - name: Contrast audit
        run: npm run audit:contrast
