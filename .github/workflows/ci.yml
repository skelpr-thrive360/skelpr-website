name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly CodeQL sweep, carried over from the standalone workflow this file absorbed.
    - cron: "37 5 * * 2"

concurrency:
  # Keyed on the branch, not the ref, so a push that is also a pull request's head
  # produces one live run instead of one per workflow file — the later run cancels
  # the earlier one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Palette matches palette.config.mjs
        run: npm run check:palette

      - name: No machine paths in published copy
        # The verbatim benchmark answers are generated from the engine's docs; this
        # fails if an absolute file link or a maintainer home path reaches the site.
        run: npm run check:hygiene

      - name: Typecheck & build
        run: npm run build

      - name: In-page hash links resolve
        run: npm run check:links

      - name: Contrast audit
        run: npm run audit:contrast

  codeql:
    name: CodeQL analysis
    # The site is static and does not handle credentials, but it renders
    # `src/data/benchmarkAnswers.ts` — generated content extracted from the engine's
    # docs — and posts to a waitlist endpoint; taint tracking over that path is why
    # this exists. Pull requests count only when they target the protected branches;
    # pushes and the weekly sweep always run. Uploading results is an Advanced
    # Security feature a private repository does not have, so the job also skips
    # there instead of failing every run — and starts by itself at the visibility
    # flip, no edit needed (same guard as dependency-review).
    if: github.event.repository.private == false && (github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency review
    # Dependency review reads GitHub's dependency graph, which a private repository
    # only gets with Advanced Security. It cannot run here yet, so it skips instead
    # of failing every pull request — and starts running by itself at the visibility
    # flip, no edit needed.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  notify-engine:
    name: Ask the engine to re-verify published claims
    # The engine publishes the benchmark numbers, the site renders them, and the two
    # live in different repositories — so a change here can invalidate a claim there.
    # The engine's cross-repo claims job also runs on a schedule; this makes it
    # immediate. It is a notification, never a gate: without the token it says so and
    # passes, so a fork or a fresh clone stays green.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch website-updated to the engine
        env:
          TOKEN: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::ENGINE_DISPATCH_TOKEN is not configured, so the engine was not notified."
            echo "::notice::Its scheduled claims job still re-verifies every published number twice a week."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/skelpr-thrive360/skelpr/dispatches \
            -d '{"event_type":"website-updated"}'
          echo "Engine notified; see its 'Published claims' workflow."
