<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f8f4" />
    <script>
      // Same key and same reasoning as index.html: the docs page is a second entry
      // into the same bundle graph, so it has to read the remembered theme before
      // the first paint too — otherwise arriving here from a dark page flashes
      // light until React mounts. Keep in sync with src/lib/theme.ts.
      try {
        var choice = localStorage.getItem('skelpr-theme')
        if (choice === 'light' || choice === 'dark' || choice === 'system') {
          document.documentElement.dataset.theme = choice
        }
      } catch (error) {
        // Storage blocked: the page simply follows the system preference.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The install guide's own sentence, in the order a searcher hits the
         commands. 152 characters — inside the band `check:seo` enforces. -->

      name="description"
      content="Install Skelpr in minutes: prerequisites, pip install on Linux, macOS and Windows, activation with your token, first run, troubleshooting and uninstall."
    />

    <meta name="twitter:title" content="Install &amp; activate Skelpr — setup guide | Skelpr docs" />
    <meta
      name="twitter:description"
      content="Install Skelpr in minutes: prerequisites, pip install on Linux, macOS and Windows, activation with your token, first run, troubleshooting and uninstall."

    <meta name="twitter:image" content="https://www.skelpr.com/brand/og-card.png" />

    <title>Install &amp; activate Skelpr — setup guide | Skelpr docs</title>
    <!-- Document-shaped schema: the piece, the procedure it teaches (steps mirror
         the install/activate/first-run headings of src/docs/install.md), and its
         place in the site. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "TechArticle",
          "headline": "Install & activate Skelpr",
          "description": "Prerequisites, installation, activation and first run — with the exact commands and the output to expect.",
          "inLanguage": "en",
          "url": "https://www.skelpr.com/docs",
          "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.skelpr.com/docs" },
          "publisher": { "@id": "https://www.skelpr.com/#organization" },
          "author": { "@id": "https://www.skelpr.com/#organization" }
        },
        {
          "@type": "HowTo",
          "name": "Install and activate Skelpr",
          "description": "From prerequisites to a first indexed repository: the five steps of setting Skelpr up on one machine.",
          "url": "https://www.skelpr.com/docs",
          "step": [
            {
              "@type": "HowToStep",
              "name": "Meet the prerequisites",
              "text": "Python 3.10 or newer, git on your PATH, Docker Desktop running, and an embeddings server — by default LM Studio serving nomic-embed-text-v1.5 at http://127.0.0.1:1234/v1."
            },
            {
              "@type": "HowToStep",
              "name": "Get a token",
              "text": "Request access and you are issued a personal token of the form LDX1.<payload>.<signature>. It records your features, expiry and seat count — a seat is a machine."
            },
            {
              "@type": "HowToStep",
              "name": "Install the package",
              "text": "python3 -m pip install skelpr — or pip install \"skelpr[mcp]\" for the MCP server. Then check it with skelpr --version."
            },
            {
              "@type": "HowToStep",
              "name": "Activate this machine",
              "text": "skelpr activate <the token from your email>. The signature is verified offline first, then the machine takes one seat and receives a lease stored at ~/.skelpr/lease.key."
            },
            {
              "@type": "HowToStep",
              "name": "Run it on your repository",
              "text": "cd into the repo, then skelpr setup, skelpr init, skelpr index — and skelpr ask \"how does authentication token refresh work?\""
            }
          ]
        },
        {
          "@type": "BreadcrumbList",

            }

    }
