<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- One tag, not a media pair: the runtime re-points it at whichever surface
         the derived palette resolves to, including when the visitor overrides
         their system preference. This value is the No-JS light fallback. -->
    <meta name="theme-color" content="#f9f8f4" />
    <script>
      // Runs before the first paint, so a remembered theme never flashes the other
      // one while the bundle loads. The key is shared with src/lib/theme.ts;
      // change both together.
      try {
        var choice = localStorage.getItem('skelpr-theme')
        if (choice === 'light' || choice === 'dark' || choice === 'system') {
          document.documentElement.dataset.theme = choice
        }
      } catch (error) {
        // Storage blocked: the page simply follows the system preference.
      }
    </script>
    <!-- Modern browsers pick the SVG first: it flips to the light mark in dark
         tabs via an embedded prefers-color-scheme query. Safari ignores SVG
         favicons and falls through to the ICO, then the PNGs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- The one a crawler can actually take: Google ignores SVG favicons and
         skips anything under 48px, and the 16/32 PNGs below are both under it. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The indexable sentence: carries the query the brand is found under (AI
         agents, code retrieval, MCP) and the integrations by name. Held to 160
         characters — `check:seo` enforces the band Google truncates past. -->
    <meta
      name="description"
      content="Skelpr returns repository evidence within a context budget, with file:line citations. Connect coding agents over MCP or use the standalone CLI."
    />
    <!-- `max-image-preview: large` is what lets the og card show full size. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <!-- Canonical host: https://www.skelpr.com. Vercel 308-redirects the apex
         domain to www, so www is the URL that answers 200 — declaring the
         redirecting host canonical pointed every signal at a URL that bounces.
         Kept in sync with public/sitemap.xml, public/robots.txt and
         docs/index.html; `check:seo` fails the build if they drift. -->
    <link rel="canonical" href="https://www.skelpr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skelpr" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.skelpr.com/" />
    <meta property="og:title" content="Skelpr — cited repository context for MCP and CLI" />
    <meta
      property="og:description"
      content="Skelpr returns repository evidence within a context budget, with file:line citations. Connect coding agents over MCP or use the standalone CLI."
    />
    <meta property="og:image" content="https://www.skelpr.com/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Skelpr — repository evidence with file:line citations." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skelpr — cited repository context for MCP and CLI" />
    <meta
      name="twitter:description"
      content="Skelpr returns repository evidence within a context budget, with file:line citations. Connect coding agents over MCP or use the standalone CLI."
    />
    <meta name="twitter:image" content="https://www.skelpr.com/brand/og-card.png" />
    <meta name="twitter:image:alt" content="Skelpr — repository evidence with file:line citations." />
    <title>Skelpr — cited repository context for MCP and CLI</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.skelpr.com/#organization",
          "name": "Skelpr",
          "url": "https://www.skelpr.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.skelpr.com/brand/logo-skelpr.png"
          },
          "email": "theskelpr@gmail.com",
          "description": "Repository evidence with file:line citations for coding agents and CLI workflows.",
          "sameAs": [
            "https://www.instagram.com/skelpr_ai",
            "https://www.linkedin.com/company/skelpr"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.skelpr.com/#website",
          "name": "Skelpr",
          "url": "https://www.skelpr.com/",
          "inLanguage": "en",
          "publisher": {
            "@id": "https://www.skelpr.com/#organization"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Skelpr",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Linux, macOS, Windows",
          "description": "Skelpr returns repository evidence within a context budget, with file:line citations. Connect coding agents over MCP or use the standalone CLI.",
          "url": "https://www.skelpr.com/",
          "screenshot": "https://www.skelpr.com/brand/og-card.png",
          "featureList": "Budgeted repository evidence; file:line citations; MCP tools for coding agents; standalone CLI for ask, chat, review and fix",
          "publisher": {
            "@id": "https://www.skelpr.com/#organization"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Skelpr?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Skelpr returns repository evidence with file:line citations within a context budget. Connect it to a coding agent over MCP or use the CLI with your own generation provider. In MCP mode, the agent does the reasoning."
              }
            },
            {
              "@type": "Question",
              "name": "How is it different from grep or an embedding search?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Skelpr returns selected code excerpts and related evidence, with source ranges and response limits. This can replace repeated searches and file reads. A limit can exclude relevant code; check reported gaps and request more context when needed. Token savings depend on the task, model and repository."
              }
            },
            {
              "@type": "Question",
              "name": "Which agents can call it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MCP-compatible clients can call Skelpr. skelpr install-mcp detects supported clients, including Codex, Claude Code and Cursor. Configure other clients manually. Reconnect after installation and approve tools as your client requires. The agent decides when to call them; installation does not guarantee tool use."
              }
            },
            {
              "@type": "Question",
              "name": "What do I need to run it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Use Python 3.10 or newer, Git and an activation token. Standard setup uses Docker for PostgreSQL, Qdrant and isolated validation. Configure an embedding endpoint for semantic search. Standalone ask, chat, review and fix also need a generation provider. External database services are supported. Host validation requires explicit opt-in."
              }
            },
            {
              "@type": "Question",
              "name": "Does my code leave my machine?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "That depends on your configuration. Hosted embeddings receive indexed text and queries. Hosted generation can receive prompts and selected source context. Remote storage and optional Langfuse tracing can also receive source. Activation sends licensing data, and managed leases check in during use. Your coding agent has its own data policy."
              }
            },
            {
              "@type": "Question",
              "name": "How do I get access?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Install with pip install skelpr. Running requires a personal activation token: request access, then run skelpr activate with your token. Each activated machine uses one seat. Run skelpr license to check the current state."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
