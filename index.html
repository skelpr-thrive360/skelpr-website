<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- One tag, not a media pair: the runtime re-points it at whichever surface
         the derived palette resolves to, including when the visitor overrides
         their system preference. This value is the No-JS light fallback. -->
    <meta name="theme-color" content="#f9f8f4" />
    <script>
      // Runs before the first paint, so a remembered theme never flashes the other
      // one while the bundle loads. The key is shared with src/lib/theme.ts;
      // change both together.
      try {
        var choice = localStorage.getItem('skelpr-theme')
        if (choice === 'light' || choice === 'dark' || choice === 'system') {
          document.documentElement.dataset.theme = choice
        }
      } catch (error) {
        // Storage blocked: the page simply follows the system preference.
      }
    </script>
    <!-- Modern browsers pick the SVG first: it flips to the light mark in dark
         tabs via an embedded prefers-color-scheme query. Safari ignores SVG
         favicons and falls through to the ICO, then the PNGs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The indexable sentence: carries the query the brand is found under (AI
         agents, code retrieval, MCP) and the integrations by name. Held to 160
         characters — `check:seo` enforces the band Google truncates past. -->
    <meta
      name="description"
      content="Skelpr gives AI agents the right code instead of the whole repo: syntax-aware retrieval with file:line citations, over MCP for Claude Code, Cursor and Antigravity."
    />
    <!-- `max-image-preview: large` is what lets the og card show full size. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <!-- Canonical host: https://www.skelpr.com. Vercel 308-redirects the apex
         domain to www, so www is the URL that answers 200 — declaring the
         redirecting host canonical pointed every signal at a URL that bounces.
         Kept in sync with public/sitemap.xml, public/robots.txt and
         docs/index.html; `check:seo` fails the build if they drift. -->
    <link rel="canonical" href="https://www.skelpr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skelpr" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.skelpr.com/" />
    <meta property="og:title" content="Skelpr — AI code retrieval for coding agents" />
    <meta
      property="og:description"
      content="Skelpr gives AI agents the right code instead of the whole repo: syntax-aware retrieval with file:line citations, over MCP for Claude Code, Cursor and Antigravity."
    />
    <meta property="og:image" content="https://www.skelpr.com/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Skelpr — surgical code retrieval for AI agents, with file:line citations." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skelpr — AI code retrieval for coding agents" />
    <meta
      name="twitter:description"
      content="Skelpr gives AI agents the right code instead of the whole repo: syntax-aware retrieval with file:line citations, over MCP for Claude Code, Cursor and Antigravity."
    />
    <meta name="twitter:image" content="https://www.skelpr.com/brand/og-card.png" />
    <meta name="twitter:image:alt" content="Skelpr — surgical code retrieval for AI agents, with file:line citations." />
    <title>Skelpr — AI code retrieval for coding agents</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.skelpr.com/#organization",
          "name": "Skelpr",
          "url": "https://www.skelpr.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.skelpr.com/brand/logo-skeplr.png"
          },
          "email": "theskelpr@gmail.com",
          "description": "Surgical code retrieval for AI agents, PR reviews, and fixes."
        },
        {
          "@type": "WebSite",
          "@id": "https://www.skelpr.com/#website",
          "name": "Skelpr",
          "url": "https://www.skelpr.com/",
          "inLanguage": "en",
          "publisher": { "@id": "https://www.skelpr.com/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Skelpr",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Linux, macOS, Windows",
          "description": "Surgical code retrieval for AI agents, PR reviews, and fixes. Grounded in syntax-aware context and precise file:line citations.",
          "url": "https://www.skelpr.com/",
          "screenshot": "https://www.skelpr.com/brand/og-card.png",
          "featureList": "Hybrid symbolic, lexical and graph retrieval; file:line citations; MCP server for agents such as Claude Code, Cursor and Antigravity; CLI for review, diff and fix",
          "publisher": { "@id": "https://www.skelpr.com/#organization" },
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Skelpr?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Skelpr is surgical code retrieval for AI agents, PR reviews, and fixes. It finds the parts of a repository that matter, ranks them, and hands your agent a small context package with precise file:line citations. Skelpr retrieves and cites — your agent still does the reasoning."
              }
            },
            {
              "@type": "Question",
              "name": "How is it different from grep or an embedding search?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Search finds matches; Skelpr assembles evidence. It combines symbolic, lexical and graph signals over an indexed repository and returns a ranked, token-efficient package — the benchmarked runs opened 76% fewer files and spent 59% fewer agent tokens."
              }
            },
            {
              "@type": "Question",
              "name": "Which agents can call it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Anything that speaks MCP. skelpr install-mcp auto-detects common agents such as Claude Code, Cursor and Antigravity, and skelpr register-agent covers the rest. The CLI takes the same retrieval path for review, diff and fix without an agent in the loop."
              }
            },
            {
              "@type": "Question",
              "name": "What do I need to run it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Python 3.10 or newer, Docker Desktop running, and an embeddings endpoint — the hosted one if your token carries it, otherwise a local model such as LM Studio serving nomic-embed-text-v1.5 on port 1234. Without Docker the core still runs on in-memory fallbacks; you lose sandboxed validation and the production stores, not the assistant."
              }
            },
            {
              "@type": "Question",
              "name": "Does my code leave my machine?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Retrieval, indexing and review run locally, and there is no telemetry. Activation sends only your token and a hash of this machine’s id — no hostname, no file paths, no code, no usage."
              }
            },
            {
              "@type": "Question",
              "name": "How do I get access?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "pip install skelpr is open to anyone; running is licensed per machine. Join the waitlist and we send a token that activates one seat — a seat is a machine, not a person or a repository."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
