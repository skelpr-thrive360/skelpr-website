<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- One tag, not a media pair: the runtime re-points it at whichever surface
         the derived palette resolves to, including when the visitor overrides
         their system preference. This value is the No-JS light fallback. -->
    <meta name="theme-color" content="#f9f8f4" />
    <script>
      // Runs before the first paint, so a remembered theme never flashes the other
      // one while the bundle loads. The key is shared with src/lib/theme.ts;
      // change both together.
      try {
        var choice = localStorage.getItem('skelpr-theme')
        if (choice === 'light' || choice === 'dark' || choice === 'system') {
          document.documentElement.dataset.theme = choice
        }
      } catch (error) {
        // Storage blocked: the page simply follows the system preference.
      }
    </script>
    <!-- Modern browsers pick the SVG first: it flips to the light mark in dark
         tabs via an embedded prefers-color-scheme query. Safari ignores SVG
         favicons and falls through to the ICO, then the PNGs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="Skelpr — surgical code retrieval for AI agents, PR reviews, and fixes." />
    <!-- Canonical domain: https://skelpr.com — kept in sync with public/sitemap.xml,
         public/robots.txt, and the og/twitter URLs below. -->
    <link rel="canonical" href="https://skelpr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skelpr" />
    <meta property="og:url" content="https://skelpr.com/" />
    <meta property="og:title" content="Skelpr — Surgical code retrieval" />
    <meta property="og:description" content="Surgical code retrieval for AI agents, PR reviews, and fixes. Grounded in syntax-aware context and precise file:line citations." />
    <meta property="og:image" content="https://skelpr.com/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skelpr — Surgical code retrieval" />
    <meta name="twitter:description" content="Surgical code retrieval for AI agents, PR reviews, and fixes. Grounded in syntax-aware context and precise file:line citations." />
    <meta name="twitter:image" content="https://skelpr.com/brand/og-card.png" />
    <title>Skelpr — Surgical code retrieval</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Skelpr",
          "url": "https://skelpr.com/"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Skelpr",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "Linux, macOS, Windows",
          "description": "Surgical code retrieval for AI agents, PR reviews, and fixes. Grounded in syntax-aware context and precise file:line citations.",
          "url": "https://skelpr.com/",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
